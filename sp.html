<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentary</title>
<link rel="stylesheet" href="music.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <a href="artist.html"><h2>Fav playlist</h2></a>
    <form id="searchForm" class="d-flex">
      <input id="searchInput" class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
      <button id="searchBtn" class="btn btn-success" type="submit">Search</button>
    </form>
    <ul id="playlist">
      <li data-src="audio/song1.mp3">1.EnnaiKaanavillaiye</li>
      <li data-src="audio/song2.mp3">2.Kadhalikum</li>
      <li data-src="audio/song3.mp3">3.Maanguyile Poonguyile </li>
      <li data-src="audio/song1.mp3">4.Malare</li>
      <li data-src="audio/song2.mp3">5.Mannil Indha</li>
      <li data-src="audio/song3.mp3">6.Nilaave Vaai</li>
      <li data-src="audio/song3.mp3">7.OthayadiPaadhayile</li>
      <li data-src="audio/song1.mp3">8.PanivizhumMalar</li>
      <li data-src="audio/song2.mp3">9.NenjukulleInnarunnu</li>
      <li data-src="audio/song3.mp3">10.IlaiyaNila</li>
    </ul>
    <ul id="suggestionsList" class="suggestions"></ul>
  </div>
  <div class="player">
    <h2 id="currentSong">Ennai-Kaanavillaiye</h2>
    <div class="cd-container">
      <div class="cd">
        <img id="currentImage" src="kadhal-desam-1996.webp" alt="Album Cover">
      </div>
    </div>
    <div class="audio-controls">
      <canvas id="waveformCanvas" width="600" height="80"></canvas> 
      <audio id="myAudio" controls onended="playNext()">
        <source src="Ennai-Kaanavillaiye.mp3" type="audio/mpeg">
      </audio>
    </div>
    <div class="player-controls">
      <div class="controls">
        <button id="prevBtn" onclick="prevSong()"><i class="bi bi-skip-backward"></i></button>
        <button id="playPauseBtn" onclick="togglePlayPause()"><i class="bi bi-play"></i></button>
        <button id="nextBtn" onclick="nextSong()"><i class="bi bi-skip-forward"></i></button>
      </div>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" onchange="setVolume()">
    </div>
  </div>
</div>
 <script src="sp.js"></script>
</body>
</html>
