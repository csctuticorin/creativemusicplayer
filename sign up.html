<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sign up.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+NL:wght@100..400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <a href="musicplayer.html"><h1 class="head" style="color: red;">Creative <i class="bi bi-play-circle-fill"></i> music </h1></a>
            <form action="#">
                <div class="user-details">
                    <div class="input-box">
                        <span class="details" style="color: yellow;">FirstName</span>
                        <input type="text" placeholder="Enter your firstname" required>
                    </div>
                    <div class="input-box">
                        <span class="details"style="color: yellow;">LastName</span>
                        <input type="text" placeholder="Enter your lastname" required>
                    </div>
                    <div class="input-box">
                        <span class="details"style="color: yellow;">Email</span>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-box">
                        <span class="details" style="color: yellow;">Phone number</span>
                        <input type="number" placeholder="Enter your phone number" required>
                    </div>
                    <div class="input-box">
                        <span class="details"style="color: yellow;">Password</span>
                        <input type="Password" placeholder="Enter your Password" required>
                    </div>
                    <div class="input-box">
                        <span class="details"style="color: yellow;">Confirm Password</span>
                        <input type="Password" placeholder="Confirm your Password" required>
                    </div>
                </div>
                <div class="gender-details">
                    <input type="radio" name="gender" id="dot-1">
                    <input type="radio" name="gender" id="dot-2">
                    <input type="radio" name="gender" id="dot-3">
                    <span class="gender-title"style="color: yellow;">Gender</span>
                    <div class="category">
                        <label for="dot-1">
                            <span class="dot one"></span>
                           
                            <span class="gender"style="color: yellow;">Female</span>
                        </label>
                        <label for="dot-2">
                            <span class="dot two"></span>
                            
                            <span class="gender"style="color: yellow;">Male</span>
                        </label>
                        <label for="dot-3">
                            <span class="dot three"></span>

                            <span class="gender"style="color: yellow;">Prefer not to tell</span>
                        </label>
                    </div>
                </div>
                  <div class="button">
                    <input type="submit" value="Enter">
                  </div>
            </form>
        </div>
</body>
</html>
