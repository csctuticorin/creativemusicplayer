<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container text-center">
    <div class="loginform">
      <a href="musicplayer.html"><h1 class="head">Creative <i class="bi bi-play-circle-fill"></i> music </h1></a>
      <form id="loginForm">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="floatingInput" placeholder="Login id" required>
          <label for="floatingInput">Login id</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
          <label for="floatingPassword">Password</label>
        </div>
        <div class="d-grid gap">
          <button class="btn btn-outline-warning" type="submit">Login</button>
        </div>
      </form>
      <div class="account"><h4>Don't have an account? <a href="sign up.html">Sign up</a></h4></div>
      <div class="login"><h4>or Login with</h4></div>
      <div class="icon-container">
        <h1><a href="https://www.facebook.com/" target="_blank"><i style="color: blue;"    class="bi bi-facebook"></i></a></h1>
        <h1><a href="https://www.instagram.com/" target="_blank"><i style="color: rgb(119, 5, 43);"class="bi bi-instagram"></i></a></h1>
        <h1><a href="https://x.com/i/flow/login" target="_blank"><i style="color: lightskyblue;"class="bi bi-twitter"></i></a></h1>
        <h1><a href="https://myaccount.google.com/?pli=1" target="_blank"><i style="color: white" class="bi bi-google"></i></a></h1>
      </div>
    </div>
  </div>
<script src="login.js"></script>
</body>
</html>
